  --blue:#0a84ff;--green:#30d158;--red:#ff453a;--orange:#ff9f0a;--purple:#bf5af2;
}}
:root[data-theme="dark"]{
  --bg:#0d1b2e;--bg2:#112236;--card:rgba(255,255,255,.06);--card-solid:#162843;--glass:rgba(15,30,55,.75);
  --text:#e8edf5;--text2:#b8c5d6;--muted:#7a90aa;--line:rgba(120,160,220,.18);--field:rgba(255,255,255,.08);--field2:rgba(255,255,255,.12);
  --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 28px rgba(0,0,20,.6);color-scheme:dark;
  --blue:#0a84ff;--green:#30d158;--red:#ff453a;--orange:#ff9f0a;--purple:#bf5af2;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;display:flex;height:100vh;overflow:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(900px 600px at 10% -10%,rgba(0,122,255,.10),transparent 60%),
             radial-gradient(800px 600px at 110% 10%,rgba(175,82,222,.08),transparent 60%),
             radial-gradient(700px 500px at 50% 120%,rgba(52,199,89,.07),transparent 60%)}
button,input,select,textarea{font:inherit;color:inherit}

/* ===== SIDEBAR ===== */
#sidebar{
  width:var(--sidebar);min-width:var(--sidebar);
  background:var(--glass);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;height:100vh;overflow:hidden;z-index:30;flex-shrink:0;
}
.sb-logo{padding:18px 16px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;min-height:68px}
.sb-logo img{width:36px;height:36px;object-fit:contain;border-radius:10px;flex-shrink:0}
.sb-logo-text{overflow:hidden}
.sb-logo-name{font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;letter-spacing:-.01em}
.sb-logo-sub{font-size:11px;color:var(--muted);white-space:nowrap;margin-top:1px}

.sb-store{padding:10px 12px;border-bottom:1px solid var(--line)}
.sb-store select{width:100%;background:var(--field);border:0;color:var(--text);border-radius:10px;padding:8px 11px;font-size:13px;font-family:inherit;cursor:pointer;outline:none}
.sb-store select:focus{box-shadow:0 0 0 3px rgba(0,122,255,.25)}

.sb-nav{flex:1;overflow-y:auto;padding:8px 0}
.sb-nav::-webkit-scrollbar{width:3px}
.sb-nav::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}
.sb-section{padding:14px 16px 4px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:8px 10px;margin:1px 8px;
  border-radius:12px;cursor:pointer;transition:background .13s,color .13s;color:var(--text2);text-decoration:none;white-space:nowrap;font-weight:500;
}
.nav-item:hover{background:rgba(120,120,128,.10);color:var(--text)}
.nav-item.active{background:var(--blue);color:#fff;box-shadow:0 4px 14px rgba(0,122,255,.32)}
.nav-item.active .nav-label{font-weight:650}
.nav-icon{
  width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:all .13s;
}
/* coloured icons per section */
.nav-item[data-page="orders"] .nav-icon{background:rgba(0,122,255,.13);color:var(--blue)}
.nav-item[data-page="izdatnice"] .nav-icon{background:rgba(52,199,89,.13);color:var(--green)}
.nav-item[data-page="fakture"] .nav-icon{background:rgba(255,149,0,.13);color:#e07800}
.nav-item[data-page="articles"] .nav-icon{background:rgba(175,82,222,.13);color:#af52de}
.nav-item[data-page="strojevi"] .nav-icon{background:rgba(50,173,230,.13);color:#32ade6}
.nav-item[data-page="settings"] .nav-icon{background:rgba(142,142,147,.13);color:var(--muted)}
.nav-item[data-page="dashboard"] .nav-icon{background:rgba(255,59,48,.10);color:var(--red)}
.nav-item.active .nav-icon{background:rgba(255,255,255,.22)!important;color:#fff!important}
.nav-label{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;padding:1px 7px;border-radius:10px;font-weight:700;min-width:20px;text-align:center}
.nav-item.active .nav-badge{background:rgba(255,255,255,.3)}

.sb-bottom{padding:10px 12px 16px;border-top:1px solid var(--line)}
.theme-btn{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;cursor:pointer;color:var(--text2);font-size:13px;transition:background .13s;font-weight:500}
.theme-btn:hover{background:rgba(120,120,128,.10);color:var(--text)}
.theme-btn .nav-icon{background:rgba(142,142,147,.13);color:var(--muted)}
.sb-version{padding:8px 12px 0;text-align:center;font-size:10.5px;color:var(--text3);letter-spacing:.2px}

/* ===== MAIN ===== */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#topbar{
  height:64px;
  background:var(--glass);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;padding:0 28px;gap:14px;flex-shrink:0;
}
.topbar-title{font-size:19px;font-weight:700;color:var(--text);flex:1;letter-spacing:-.02em}
.topbar-store-tag{background:rgba(0,122,255,.12);color:var(--blue);font-size:12px;font-weight:650;padding:4px 12px;border-radius:20px;white-space:nowrap;
  appearance:none;-webkit-appearance:none;border:none;font-family:inherit;cursor:pointer;outline:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23007aff' stroke-width='2.5'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat:no-repeat;background-position:right 8px center;background-size:11px;padding-right:26px;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.topbar-store-tag option{background:var(--card-solid,#fff);color:var(--text)}
.mob-theme-btn{background:var(--field);border:1px solid var(--line);color:var(--text2);width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;padding:0}
.mob-logo{height:30px;width:30px;object-fit:contain;border-radius:8px;flex-shrink:0}
.mob-theme-btn:active{background:var(--field2)}
.topbar-btn,.btn{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer;background:var(--field);color:var(--text);transition:transform .08s,filter .15s;white-space:nowrap;font-family:inherit;font-size:14px}
.topbar-btn:active,.btn:active{transform:scale(.97)}
.btn-primary,.btn.pri{background:var(--blue);color:#fff;box-shadow:0 6px 18px rgba(0,122,255,.28)}
.btn-primary:hover,.btn.pri:hover{filter:brightness(1.08)}
.btn-ghost,.btn.ghost{background:transparent;color:var(--blue)}
.btn-danger,.btn.dan{background:rgba(255,59,48,.12);color:var(--red)}
.btn-success{background:rgba(52,199,89,.15);color:var(--green)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}

#content{flex:1;overflow-y:auto;padding:28px 34px 60px}

/* ===== CARDS ===== */
.card{
  background:var(--card);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:20px;
}
.card-header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.card-title{font-size:15px;font-weight:700;color:var(--text);letter-spacing:-.01em}
.card-body{padding:20px}
.card-footer{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;background:rgba(120,120,128,.05);border-radius:0 0 var(--r) var(--r)}

/* ===== SECTION HEADERS ===== */
.sec{font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:18px 6px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}

/* ===== STATS ===== */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.stat-card{
  background:var(--card);backdrop-filter:blur(24px) saturate(170%);
  border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;
  box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;
  transition:transform .15s;cursor:default;
}
.stat-card:hover{transform:translateY(-2px)}
.stat-icon,.ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none;font-size:17px}
.stat-card.blue .stat-icon{background:linear-gradient(135deg,var(--blue),var(--indigo))}
.stat-card.green .stat-icon{background:linear-gradient(135deg,var(--green),#1da44e)}
.stat-card.orange .stat-icon{background:linear-gradient(135deg,var(--orange),var(--red))}
.stat-card.purple .stat-icon{background:linear-gradient(135deg,var(--purple),var(--indigo))}
.stat-info{flex:1;min-width:0}
.stat-label{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.stat-value{font-size:26px;font-weight:700;color:var(--text);line-height:1;letter-spacing:-.02em}
.stat-sub{font-size:11.5px;color:var(--muted);margin-top:3px}

/* ===== TABLE ===== */
.tbl-wrap{overflow-x:auto;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:0 2px 12px rgba(0,0,0,.06)}
table,table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:transparent}
td{padding:13px 14px;border-bottom:1px solid var(--line);color:var(--text);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .12s}
tbody tr:hover td{background:rgba(0,122,255,.04)}
.tbl-num{color:var(--muted);font-size:11px;font-weight:600}
.tbl-id{font-weight:700;color:var(--blue);font-size:13px;letter-spacing:.01em}

/* ===== PILLS (status badges) ===== */
.badge,.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:650;padding:3px 10px;border-radius:20px;white-space:nowrap}
.badge-draft,.pill.none{background:rgba(142,142,147,.16);color:var(--muted)}
.badge-sent,.pill.partial{background:rgba(255,149,0,.15);color:#c77700}
.badge-confirmed,.pill.done{background:rgba(52,199,89,.14);color:#1f9d45}
.badge-partial{background:rgba(255,149,0,.15);color:#c77700}
.badge-issued,.pill.info{background:rgba(0,122,255,.12);color:var(--blue)}
.badge-cancelled,.pill.fail{background:rgba(255,59,48,.13);color:var(--red)}

/* ===== SEGMENTED CONTROLS ===== */
.seg{display:inline-flex;background:var(--field);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 13px;border-radius:9px;font-weight:600;font-size:13px;cursor:pointer;color:var(--text2);display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--card-solid);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.12)}

/* ===== FORM FIELDS ===== */
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.form-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group.full{grid-column:1/-1}
label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
input,select,textarea{
  background:var(--field);border:0;color:var(--text);
  border-radius:10px;padding:9px 12px;font-size:15px;font-family:inherit;
  outline:0;transition:box-shadow .15s;width:100%;
}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 3px rgba(0,122,255,.25)}
input[readonly]{color:var(--muted);cursor:not-allowed}
textarea{resize:vertical;min-height:70px}
.input-red{color:var(--red)!important;font-weight:600}
.input-green{color:var(--green)!important;font-weight:600}
.input-blue{color:var(--blue)!important;font-weight:600}

/* HACCP .grp + .fr form rows */
.grp{background:var(--card-solid);border-radius:16px;overflow:hidden}
.fr{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:50px;position:relative}
.fr+.fr::before{content:"";position:absolute;top:0;left:56px;right:0;border-top:1px solid var(--line)}
.fr .lb{flex:1;min-width:0;font-weight:500;font-size:15px}
.fr .lb small{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:1px}
.fr .ctl{display:flex;align-items:center;gap:6px;justify-content:flex-end;flex:0 1 auto;min-width:0}
.fr input:not([type=checkbox]),.fr select,.fr textarea{border:0;background:var(--field);border-radius:10px;padding:8px 11px;text-align:right;min-width:0;max-width:230px;font-size:15px;width:auto}
.fr input[type=number]{width:84px;text-align:center}
.fr select{text-align:left;max-width:240px;padding-right:8px}
.fr input:focus,.fr select:focus{box-shadow:0 0 0 3px rgba(0,122,255,.25)}
.fr.col{flex-direction:column;align-items:stretch;gap:8px}
.fr.col textarea,.fr.col input{text-align:left;max-width:none;width:100%}
.fr textarea{resize:vertical;min-height:70px;text-align:left}

/* ===== ORDER ITEMS TABLE ===== */
.oi-table{width:100%;border-collapse:collapse}
.oi-table th{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);background:transparent}
.oi-table td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.oi-table tr:last-child td{border-bottom:none}
.oi-table input,.oi-table select{padding:6px 8px;font-size:13px;border-radius:8px;background:var(--field);border:0}
.oi-table .ie{width:100%}
.kgkom-wrap{display:flex;gap:4px;align-items:center}
.kgkom-wrap select{flex:0 0 90px}
.kgkom-wrap input{flex:1;min-width:60px}
.rm-btn{background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;border-radius:8px;line-height:1;transition:color .15s,background .15s}
.rm-btn:hover{color:var(--red);background:rgba(255,59,48,.1)}
.add-row-btn{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;border:1.5px dashed var(--line);background:none;color:var(--muted);font-size:13px;cursor:pointer;font-family:inherit;transition:all .15s;margin-top:10px;font-weight:600}
.add-row-btn:hover{border-color:var(--blue);color:var(--blue);background:rgba(0,122,255,.06)}

/* ===== MODAL ===== */
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}}
/* HACCP-style overlay */
.overlay{position:fixed;inset:0;z-index:1000;background:rgba(10,12,20,.38);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;padding:24px;animation:fade .18s ease}
/* legacy .modal-bg alias */
.modal-bg{position:fixed;inset:0;background:rgba(10,12,20,.38);z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(12px);animation:fade .18s ease}
.modal{width:100%;max-width:580px;max-height:calc(100vh - 48px);display:flex;flex-direction:column;
  background:rgba(236,237,242,.94);backdrop-filter:blur(34px) saturate(180%);-webkit-backdrop-filter:blur(34px) saturate(180%);
  border:1px solid rgba(255,255,255,.65);border-radius:30px;box-shadow:var(--shadow-lg);
  animation:pop .22s cubic-bezier(.2,.9,.3,1.2);overflow:hidden;}
:root[data-theme="dark"] .modal{background:#162843;border:1px solid rgba(120,160,220,.2);box-shadow:0 24px 80px rgba(0,0,0,.6)}
.modal.wide{max-width:780px}
.modal.modal-lg{max-width:780px}
.modal.modal-sm{max-width:500px}
/* HACCP modal header */
.m-head{padding:22px 22px 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-shrink:0}
.m-head .eyebrow{font-size:12px;font-weight:700;letter-spacing:.07em;color:var(--blue);text-transform:uppercase}
.m-head h2{margin:3px 0 0;font-size:21px;font-weight:700;letter-spacing:-.015em}
/* legacy aliases */
.modal-header{padding:22px 22px 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-shrink:0}
.modal-eyebrow{font-size:12px;font-weight:700;letter-spacing:.07em;color:var(--blue);text-transform:uppercase}
.modal-title{font-size:21px;font-weight:700;letter-spacing:-.015em;margin-top:3px}
/* close X button */
.x,.close-btn{width:32px;height:32px;border-radius:50%;border:0;background:rgba(120,120,128,.16);display:grid;place-items:center;cursor:pointer;color:var(--text2);flex:none;font-size:18px;line-height:1}
.x:hover,.close-btn:hover{background:rgba(120,120,128,.28)}
/* body & footer */
.m-body,.modal-body{overflow-y:auto;padding:4px 18px 18px;flex:1;overscroll-behavior:contain}
.m-foot,.modal-footer{display:flex;gap:10px;justify-content:flex-end;padding:14px 18px calc(16px + var(--safe-b));border-top:1px solid var(--line);background:rgba(255,255,255,.35);flex-shrink:0}
:root[data-theme="dark"] .m-foot,:root[data-theme="dark"] .modal-footer{background:rgba(10,20,40,.4)}
.m-foot .btn,.modal-footer .btn,.m-foot .topbar-btn,.modal-footer .topbar-btn{padding:12px 20px;border-radius:14px;font-size:15px}
.m-foot .left{margin-right:auto}
/* HACCP hero card */
.hero{margin:0 18px 4px;border-radius:20px;padding:16px 18px;color:#fff;display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,#0a7cff 0%,#3b6cf6 55%,#5b5bd6 100%);box-shadow:0 10px 28px rgba(0,122,255,.28)}
.hero.fail{background:linear-gradient(120deg,#ff453a,#ff6b5e 55%,#e0457b);box-shadow:0 10px 28px rgba(255,59,48,.28)}
.hero.partial{background:linear-gradient(120deg,#ff9500,#ffaa33 55%,#f06f35);box-shadow:0 10px 28px rgba(255,149,0,.28)}
.hero.done{background:linear-gradient(120deg,#0a7cff 0%,#3b6cf6 55%,#5b5bd6 100%);box-shadow:0 10px 28px rgba(0,122,255,.28)}
.hero.green{background:linear-gradient(120deg,#30d158,#34c759 55%,#1da44e);box-shadow:0 10px 28px rgba(52,199,89,.28)}
.hero .avatar{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.hero .hn{font-size:12.5px;opacity:.88;font-weight:500}
.hero .hv{font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.hero .hb{margin-left:auto;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);border-radius:14px;padding:4px 11px;font-weight:700;font-size:13px;white-space:nowrap}
/* Colored icon squares in .fr rows */
.ico-sq{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;font-size:15px}
.ico-sq svg{width:16px;height:16px}
.ico-sq.red{background:linear-gradient(135deg,#ff453a,#ff6b5e)}
.ico-sq.green{background:linear-gradient(135deg,#30d158,#1da44e)}
.ico-sq.blue{background:linear-gradient(135deg,#0a84ff,#3b6cf6)}
.ico-sq.orange{background:linear-gradient(135deg,#ff9f0a,#f06f35)}
.ico-sq.purple{background:linear-gradient(135deg,#bf5af2,#5856d6)}
.ico-sq.teal{background:linear-gradient(135deg,#32ade6,#0a84ff)}
.ico-sq.pink{background:linear-gradient(135deg,#ff375f,#ff2d55)}
.ico-sq.gray{background:linear-gradient(135deg,#636366,#48484a)}
.ico-sq.indigo{background:linear-gradient(135deg,#5856d6,#3a38b8)}
.ico-sq.yellow{background:linear-gradient(135deg,#ffd60a,#ff9f0a)}

/* ===== LIST ROWS ===== */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:13px;padding:12px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:10px;transition:background .12s}
.row:last-child{border-bottom:0}
.row:hover{background:rgba(120,120,128,.07)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.row .r{text-align:right;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:flex-end;gap:4px}

/* ===== SEARCH ===== */
.search-bar,.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.search-wrap,.search{display:flex;align-items:center;gap:8px;background:var(--field);border-radius:11px;padding:0 12px;flex:1;min-width:180px;max-width:340px}
.search-wrap input,.search input{border:0;background:transparent;outline:0;padding:9px 0;width:100%;font-size:14px}
.search-icon{color:var(--muted);flex:none}
.filter-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.filter-row select,.inp{border:0;background:var(--field);border-radius:10px;padding:9px 12px;outline:0;min-width:0;font-size:14px}
.filter-row select:focus,.inp:focus{box-shadow:0 0 0 3px rgba(0,122,255,.25)}
.filter-row select{width:auto;min-width:140px}

/* ===== PEOPLE DD ===== */
.people-wrap{position:relative}
.people-dd{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--card-solid);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);z-index:200;max-height:180px;overflow-y:auto}
.people-dd-item{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;transition:background .1s;font-size:14px}
.people-dd-item:hover{background:rgba(0,122,255,.08)}
.people-av{width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* ===== CHARTS ===== */
.charts-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:20px}
.chart-card{background:var(--card);backdrop-filter:blur(24px) saturate(170%);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.chart-title{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:12px;text-transform:uppercase;letter-spacing:.04em}
.chart-box{position:relative;height:200px}

/* ===== STROJEVI CARDS ===== */
.ap-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.pn-stroj-card,.ap{
  background:var(--card);backdrop-filter:blur(24px) saturate(170%);
  border:1px solid var(--line);border-radius:var(--r);padding:16px;
  cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:12px;
}
.pn-stroj-card:hover,.ap:hover{transform:translateY(-2px);border-color:rgba(0,122,255,.35)}
.pn-stroj-active{border-color:var(--blue)!important;box-shadow:0 0 0 3px rgba(0,122,255,.12),var(--shadow)!important}
.pn-stroj-header,.ap-h{display:flex;align-items:center;gap:12px;justify-content:space-between}
.pn-stroj-avatar{
  width:44px;height:44px;border-radius:12px;flex-shrink:0;
  background:linear-gradient(135deg,var(--blue),var(--indigo));
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:800;color:#fff;letter-spacing:.5px;
  box-shadow:0 4px 12px rgba(0,122,255,.35);
}
.pn-stroj-id{font-size:10px;font-weight:700;color:var(--blue);letter-spacing:1px;text-transform:uppercase;margin-bottom:2px}
.pn-stroj-name{font-size:14px;font-weight:700;color:var(--text);line-height:1.2}
.pn-stroj-badge{background:rgba(52,199,89,.14);color:#1f9d45;font-size:11px;font-weight:650;padding:3px 10px;border-radius:20px;white-space:nowrap}
.pn-stroj-addr{font-size:12.5px;color:var(--muted);line-height:1.4}
.pn-stroj-stats{display:flex;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.pn-stroj-stat{display:flex;flex-direction:column;align-items:center;flex:1;padding:0 8px}
.pn-stroj-stat:first-child{border-right:1px solid var(--line)}
.pn-stat-num{font-size:20px;font-weight:700;color:var(--text);line-height:1;letter-spacing:-.02em}
.pn-stat-lbl{font-size:10.5px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.pn-stroj-edit-hint{font-size:11px;color:var(--muted);font-style:italic}
/* Add new stroj */
.pn-stroj-add{
  border:1.5px dashed var(--line);border-radius:var(--r);padding:32px 20px;
  cursor:pointer;transition:all .2s;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:transparent;min-height:160px;
}
.pn-stroj-add:hover{border-color:var(--blue);background:rgba(0,122,255,.04)}
.pn-stroj-add-icon{
  width:50px;height:50px;border-radius:14px;
  background:rgba(0,122,255,.1);
  display:flex;align-items:center;justify-content:center;
  font-size:26px;color:var(--blue);margin-bottom:12px;
}
.pn-stroj-add-label{font-size:14px;font-weight:650;color:var(--text2);margin-bottom:4px}
.pn-stroj-add-sub{font-size:12px;color:var(--muted)}

/* ===== INVOICE UPLOAD ===== */
.invoice-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.invoice-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card-solid);border:1px solid var(--line);border-radius:12px}
.invoice-icon{color:var(--red);flex-shrink:0}
.invoice-name{flex:1;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.invoice-date{font-size:11px;color:var(--muted);flex-shrink:0}
.invoice-del{background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;border-radius:6px}
.invoice-del:hover{color:var(--red)}
.upload-zone{border:2px dashed var(--line);border-radius:20px;padding:36px 24px;text-align:center;cursor:pointer;transition:all .2s;color:var(--muted);background:var(--field);position:relative}
.upload-zone:hover,.upload-zone.drag-over{border-color:var(--blue);color:var(--blue);background:rgba(0,122,255,.07);transform:translateY(-1px)}
.upload-zone .uz-icon{width:52px;height:52px;border-radius:16px;background:rgba(0,122,255,.12);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:var(--blue);transition:all .2s}
.upload-zone:hover .uz-icon,.upload-zone.drag-over .uz-icon{background:var(--blue);color:#fff;transform:scale(1.08)}
.upload-zone .uz-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:4px}
.upload-zone .uz-sub{font-size:12.5px;color:var(--muted)}
.upload-zone input{display:none}

/* ===== EMPTY STATE ===== */
.empty{padding:40px 10px;text-align:center;color:var(--muted)}
.empty-icon{font-size:38px;margin-bottom:10px;opacity:.4}
.empty-text{font-size:14.5px;font-weight:600;margin-bottom:4px;color:var(--text)}
.empty-sub{font-size:13px;color:var(--muted)}

/* ===== ALERTS ===== */
.alert{padding:10px 14px;border-radius:var(--r-sm);font-size:13px;margin-bottom:14px;display:flex;align-items:flex-start;gap:8px}
.alert-info{background:rgba(0,122,255,.1);color:var(--blue)}
.alert-warning{background:rgba(255,149,0,.12);color:#c77700}

/* ===== DIVIDER ===== */
.divider{height:1px;background:var(--line);margin:16px 0}

/* ===== TOAST ===== */
#toast-wrap{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:rgba(30,30,32,.92);color:#fff;padding:11px 18px;border-radius:14px;font-weight:550;font-size:14px;box-shadow:var(--shadow-lg);animation:pop .2s ease;display:flex;align-items:center;gap:8px;backdrop-filter:blur(20px)}
.toast.err{background:rgba(255,59,48,.95)}
.toast.ok{background:rgba(52,199,89,.95)}

/* ===== PRINT ===== */
@media print{
  #sidebar,#topbar,#pdf-controls,#toast-wrap{display:none!important}
  #main{overflow:visible;height:auto}
  #content{overflow:visible;padding:0}
  .card{break-inside:avoid}
  .no-print{display:none!important}
}

/* ═══════════════════════════════════════
   MOBILNA VERZIJA
   ═══════════════════════════════════════ */
#mob-bar{display:none}
@media (max-width: 768px){
  #sidebar{display:none!important}
  #mob-bar{
    display:flex;position:fixed;bottom:0;left:0;right:0;z-index:200;
    background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
    border-top:1px solid var(--line);
    padding:6px 0 calc(6px + env(safe-area-inset-bottom));
  }
  .mob-tab{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:4px 2px;cursor:pointer;color:var(--muted);font-size:10px;font-weight:500;
    text-decoration:none;border:none;background:none;font-family:inherit;transition:color .13s;position:relative;
  }
  .mob-tab.active{color:var(--blue)}
  .mob-tab svg{transition:transform .13s}
  .mob-tab.active svg{transform:scale(1.12)}
  .mob-tab-icon{
    width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    transition:background .13s;
  }
  .mob-tab.active .mob-tab-icon{background:rgba(0,122,255,.13)}
  .mob-tab-badge{
    position:absolute;top:2px;right:calc(50% - 18px);
    background:var(--red);color:#fff;font-size:10px;font-weight:700;
    min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;
    opacity:0;transition:opacity .13s;
  }
  .mob-tab-badge.vis{opacity:1}
  #app{flex-direction:column}
  #main{padding-bottom:70px}
  #topbar{padding:0 16px;height:52px}
  .topbar-title{font-size:16px}
  #content{padding:16px 16px 80px}
  .card{border-radius:16px}
  .tbl-wrap{border-radius:12px;font-size:12.5px}
  th,td{padding:10px 10px}
  .modal{border-radius:24px!important;max-height:92vh!important}
  .m-head{padding:16px 18px 12px!important}
  .m-body{padding:12px 16px!important}
  .m-foot{padding:10px 16px 14px!important;flex-wrap:wrap;gap:8px!important}
  .m-foot .btn{flex:1;min-width:120px;justify-content:center}
  .hero{margin:0 16px 4px!important;border-radius:16px!important}
  .ap-grid{grid-template-columns:1fr!important}
  .filter-row{flex-wrap:wrap;gap:8px}
  .filter-row select{flex:1;min-width:140px}
  .search-wrap{flex:1 1 100%}
  .tbl-hide-mob{display:none}
  .stats-row{grid-template-columns:repeat(2,1fr)!important}
  .charts-grid{grid-template-columns:1fr!important}
}
@media (max-width: 400px){
  #content{padding:12px 10px 80px}
  .topbar-title{font-size:14px}
}

/* ===== PERIOD FILTER BAR ===== */
#period-bar{
  display:flex;align-items:center;gap:10px;
  padding:7px 16px;
  background:var(--card);
  border-bottom:1px solid var(--line);
  flex-shrink:0;
}
.pb-year{
  display:flex;align-items:center;
  background:var(--field);border-radius:11px;overflow:hidden;
  border:1px solid var(--line);
}
.pb-year-val{
  font-size:14px;font-weight:700;color:var(--text);
  padding:5px 10px;min-width:46px;text-align:center;
}
.pb-arr{
  background:none;border:none;cursor:pointer;
  color:var(--muted);padding:5px 9px;font-size:18px;line-height:1;
  transition:color .13s;
}
.pb-arr:hover{color:var(--blue)}
.pb-select-wrap{
  position:relative;display:flex;align-items:center;
}
.pb-select{
  appearance:none;-webkit-appearance:none;
  background:var(--field);
  border:1px solid var(--line);
  border-radius:11px;
  color:var(--text);
  font-size:13.5px;font-weight:600;
  font-family:inherit;
  padding:5px 32px 5px 13px;
  cursor:pointer;
  outline:none;
  transition:border-color .13s,box-shadow .13s;
  min-width:150px;
}
.pb-select:focus,.pb-select:hover{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,122,255,.12)}
.pb-select option{background:var(--card);color:var(--text)}
.pb-select-arrow{
  position:absolute;right:10px;pointer-events:none;
  color:var(--muted);display:flex;align-items:center;
}
.pb-exports{
  display:flex;gap:6px;margin-left:auto;
}
.pb-export-btn{padding:5px 11px!important;font-size:12.5px!important;border-radius:10px!important;display:flex;align-items:center;gap:5px}
@media(max-width:768px){
  #period-bar{padding:6px 10px;gap:6px;flex-wrap:wrap}
  .pb-select{min-width:120px;font-size:12.5px}
  .pb-exports{margin-left:0;flex-wrap:wrap;gap:4px}
  .pb-export-btn{padding:4px 9px!important;font-size:12px!important}
}

#mob-bar{display:flex!important;position:fixed;bottom:0;left:0;right:0;z-index:200}

/* Topbar */
#topbar{height:48px!important;padding:0 10px!important;gap:6px!important}

/* Cards & typography */

/* Form grids */
.form-grid{grid-template-columns:1fr!important;gap:10px!important}
.form-grid-3{grid-template-columns:1fr 1fr!important;gap:10px!important}

<script>
// ============================================================
// DATA
// ============================================================
var STORAGE_KEY = 'pn5';
var DEFAULT_STORES = [
  {id:'VS-001',name:'JOKER GYM',addr:'Matoševa 56, 21000 Split',note:''}
];

function freshDB(){
  return {
    orders:[], izdatnice:[], products:[], strojevi: JSON.parse(JSON.stringify(DEFAULT_STORES)),
    fakture:[],
    settings:{
      buyerName:'Perla Notte j.d.o.o.', buyerOib:'HR12345678901',

      sellerName:'Polleo Adria d.o.o.', sellerOib:'HR98765432109',

      defaultNote:'Molimo potvrdite primitak ove narudžbe i rok isporuke.',
      logoDataUrl:null
    },
    counters:{orders:0, izdatnice:0}
  };
}

var DB = freshDB();
var CURRENT_STORE = 'all';
var APP_VERSION = '1.5.3';
var APP_VERSION_DATE = '04.10.2026';

// ============================================================
// PERIOD FILTER
// ============================================================
var PERIOD_YEAR = new Date().getFullYear();
var PERIOD_MONTH = null; // null = whole year, 0-11 = month index

var MONTH_NAMES_HR = ['Siječanj','Veljača','Ožujak','Travanj','Svibanj','Lipanj',
  'Srpanj','Kolovoz','Rujan','Listopad','Studeni','Prosinac'];

function getPeriodLabel(){
  if(PERIOD_MONTH === null) return 'Cijela '+PERIOD_YEAR;
  return MONTH_NAMES_HR[PERIOD_MONTH]+' '+PERIOD_YEAR;
}

function getPeriodFilename(){
  if(PERIOD_MONTH === null) return PERIOD_YEAR+'';
  var m = (PERIOD_MONTH+1)<10 ? '0'+(PERIOD_MONTH+1) : ''+(PERIOD_MONTH+1);
  return PERIOD_YEAR+'-'+m;
}

function periodMatchDate(dateStr){
  if(!dateStr) return false;
  var d = new Date(dateStr);
  if(isNaN(d.getTime())){
    // try dd.mm.yyyy
    var parts = dateStr.split('.');
    if(parts.length===3) d = new Date(parts[2]+'-'+parts[1]+'-'+parts[0]);
  }
  if(isNaN(d.getTime())) return true; // can't parse, include
  if(d.getFullYear() !== PERIOD_YEAR) return false;
  if(PERIOD_MONTH === null) return true;
  return d.getMonth() === PERIOD_MONTH;
}

function setPeriodYear(delta){
  PERIOD_YEAR += delta;
  renderPeriodBar();
  refreshCurrentPage();
}

function setPeriodMonth(m){
  PERIOD_MONTH = (PERIOD_MONTH === m) ? null : m;
  renderPeriodBar();
  refreshCurrentPage();
}

function renderPeriodBar(){
  var yv = document.getElementById('pb-year-val');
  if(yv) yv.textContent = PERIOD_YEAR;
  var sel = document.getElementById('pb-month-select');
  if(sel) sel.value = PERIOD_MONTH === null ? 'all' : String(PERIOD_MONTH);
}

function setPeriodFromSelect(val){
  PERIOD_MONTH = (val === 'all') ? null : parseInt(val, 10);
  refreshCurrentPage();
}

function refreshCurrentPage(){
  var active = document.querySelector('.nav-item.active');
  var mobActive = document.querySelector('#mob-bar .mob-tab.active');
  var page = (active && active.dataset.page) || (mobActive && mobActive.dataset.page) || 'dashboard';
  showPage(page);
}


var CURRENT_PAGE = 'dashboard';

function loadDB(){
  try{
    var s = localStorage.getItem(STORAGE_KEY);
    if(s){ var d = JSON.parse(s); DB = Object.assign(freshDB(), d); }
  }catch(e){}
}
function saveDB(){ try{ localStorage.setItem(STORAGE_KEY,JSON.stringify(DB)); }catch(e){} try{ localStorage.setItem(SB_DIRTY_KEY,'1'); }catch(e){} scheduleSupabasePush(); }
function saveDBLocalOnly(){ try{ localStorage.setItem(STORAGE_KEY,JSON.stringify(DB)); }catch(e){} }

// ============================================================
// SUPABASE SINKRONIZACIJA (Perla Notte — projekt "perla-haccp")
// ============================================================
var SUPABASE_URL = 'https://vvkyzqvdbbilrsqddnha.supabase.co';
var SUPABASE_ANON_KEY = 'sb_publishable_OXQKeW6H3tTPrhNM1qihdg_WHkiB2UN';
var SB_TABLE = 'narudzba_data';
var SB_ROW_ID = 1;
var sbClient = null;
try{
  if(typeof window.supabase !== 'undefined' && window.supabase.createClient){
    sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
}catch(e){ sbClient = null; }

function syncItemCodesWithCatalog(){
  // Svaka stavka narudžbe/izdatnice ima svoju "snimljenu" šifru (code) iz trenutka kad je dodana.
  // Ovo je uskladi sa STVARNIM trenutnim šiframa iz kataloga Artikala (po prodId), tako da se
  // šifra u narudžbama uvijek "generira" iz baze artikala, a ne ostane zamrznuta na staroj vrijednosti.
  var changed = false;
  var byId = {};
  DB.products.forEach(function(p){ byId[p.id] = p; });
  function syncList(list){
    (list||[]).forEach(function(rec){
      (rec.items||[]).forEach(function(it){
        var p = (it.prodId!=null) ? byId[it.prodId] : null;
        if(p && p.code && it.code !== p.code){ it.code = p.code; changed = true; }
      });
    });
  }
  syncList(DB.orders);
  syncList(DB.izdatnice);
  return changed;
}

function isRemoteDataEmpty(d){
  if(!d) return true;
  var hasOrders = d.orders && d.orders.length;
  var hasIzd = d.izdatnice && d.izdatnice.length;
  var hasStrojevi = d.strojevi && d.strojevi.length;
  var hasProducts = d.products && d.products.length;
  return !hasOrders && !hasIzd && !hasStrojevi && !hasProducts;
}

var SB_SYNC_KEY = 'pn5_syncedAt';
var SB_DIRTY_KEY = 'pn5_dirty';
var _initialSyncDone = false;

function pushToSupabase(){
  if(!sbClient) return Promise.resolve();
  var ts = new Date().toISOString();
  return sbClient.from(SB_TABLE).upsert({ id: SB_ROW_ID, data: DB, updated_at: ts })
    .then(function(res){
      if(res.error){ console.warn('Supabase spremanje nije uspjelo:', res.error); }
      else {
        try{ localStorage.setItem(SB_SYNC_KEY, ts); }catch(e){}
        try{ localStorage.removeItem(SB_DIRTY_KEY); }catch(e){}
      }
    })
    .catch(function(e){ console.warn('Supabase spremanje nije uspjelo:', e); });
}

var _sbPushTimer = null;
function scheduleSupabasePush(){
  if(!sbClient) return;
  if(!_initialSyncDone) return; // sprječava da se bilo što pošalje PRIJE nego što završi početno uskladivanje s poslužiteljem pri pokretanju
  if(_sbPushTimer) clearTimeout(_sbPushTimer);
  _sbPushTimer = setTimeout(function(){ pushToSupabase(); }, 900);
}

function syncFromSupabase(){
  if(!sbClient) return Promise.resolve();
  return sbClient.from(SB_TABLE).select('data, updated_at').eq('id', SB_ROW_ID).maybeSingle()
    .then(function(res){
      if(res.error) throw res.error;
      var remote = res.data ? res.data.data : null;
      var remoteUpdatedAt = res.data ? res.data.updated_at : null;
      if(isRemoteDataEmpty(remote)){
        // Poslužitelj još nema podataka — šaljemo naše lokalne kao početne
        return pushToSupabase().then(function(){
          try{ toast('Povezano s bazom — lokalni podaci poslani na server', 'ok'); }catch(e){}
        });
      }
      var localSyncedAt = null;
      try{ localSyncedAt = localStorage.getItem(SB_SYNC_KEY); }catch(e){}
      var isDirty = false;
      try{ isDirty = localStorage.getItem(SB_DIRTY_KEY) === '1'; }catch(e){}
      var remoteIsNewer = !localSyncedAt || (remoteUpdatedAt && new Date(remoteUpdatedAt).getTime() > new Date(localSyncedAt).getTime());

      if(isDirty && !remoteIsNewer){
        // Ovaj uređaj ima stvarnu lokalnu izmjenu koja još nije stigla na poslužitelj
        // (npr. prekinuto prije nego je debounced push stigao) — šaljemo je sada.
        return pushToSupabase().then(function(){
          try{ toast('Povezano s bazom — lokalne izmjene poslane na server', 'ok'); }catch(e){}
        });
      }
      if(remoteIsNewer){
        // Netko (drugi uređaj, ili raniji sync) je spremio noviju verziju na poslužitelj — ona je izvor istine.
        // Namjerno se NE šalje lokalna verzija natrag u ovom slučaju (čak i ako je ovaj uređaj "dirty") —
        // upravo to je uzrokovalo da uređaj bez stvarnih izmjena pregazi tuđu noviju izmjenu na serveru.
        var safeRemote = Object.assign({}, remote);
        if((!safeRemote.products || !safeRemote.products.length) && DB.products && DB.products.length){
          // Zaštita: poslužitelj ne bi smio vratiti prazan katalog artikala, ali ako se to ikad dogodi,
          // zadrži postojeći lokalni katalog umjesto da ga obrišeš (ovo je uzrokovalo gubitak šifri).
          safeRemote.products = DB.products;
        }
        DB = Object.assign(freshDB(), safeRemote);
        try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }catch(e){}
        try{ localStorage.setItem(SB_SYNC_KEY, remoteUpdatedAt || new Date().toISOString()); }catch(e){}
        try{ localStorage.removeItem(SB_DIRTY_KEY); }catch(e){}
        try{ toast('Povezano s bazom — podaci sinkronizirani', 'ok'); }catch(e){}
      }
      // inače: lokalno je već usklađeno s poslužiteljem, nema potrebe ni slati ni povlačiti ništa
    })
    .catch(function(e){
      console.warn('Supabase sinkronizacija nije uspjela, radim lokalno (offline):', e);
      try{ toast('Nema veze s bazom — radim s lokalnim podacima', 'err'); }catch(e2){}
    });
}

// MIGRATION from old key
function migrateOldData(){
  try{
    var old = localStorage.getItem('pn4');
    if(!old) return;
    var d = JSON.parse(old);
    if(d.orders) DB.orders = d.orders;
    if(d.izdatnice) DB.izdatnice = d.izdatnice;
    if(d.products) DB.products = d.products;
    if(d.counters) DB.counters = d.counters;
    if(d.settings) DB.settings = Object.assign(DB.settings, d.settings);
    // assign old orders to VS-001
    DB.orders.forEach(function(o){ if(!o.storeId) o.storeId = 'VS-001'; });
    DB.izdatnice.forEach(function(i){ if(!i.storeId) i.storeId = 'VS-001'; });
    saveDBLocalOnly();
    localStorage.removeItem('pn4');
  }catch(e){}
}

// KG PRESETS
// ============================================================
var KG_PRESETS = [0.5,1.0,1.5,2.0,2.27,2.5,3.0,4.0,4.5,5.0,6.0,7.0,10.0,12.0,15.0,20.0,25.0];

// ============================================================
// PEOPLE MEMORY
// ============================================================
function getPeople(type){
  try{ return JSON.parse(localStorage.getItem('pn_people_'+type)||'[]'); }catch(e){ return []; }
}
function savePerson(type, val){
  val = val.trim();
  if(!val) return;
  var list = getPeople(type);
  if(!list.includes(val)){ list.unshift(val); list = list.slice(0,30); }
  localStorage.setItem('pn_people_'+type, JSON.stringify(list));
}
function buildPeopleInput(type, id, placeholder, val){
  return '<div class="people-wrap">'+
    '<input id="'+id+'" value="'+(val||'')+'" placeholder="'+placeholder+'" autocomplete="off" '+
    'onfocus="showPeopleDD(\''+id+'\',\''+type+'\')" '+
    'oninput="filterPeopleDD(\''+id+'\',\''+type+'\')" '+
    'onblur="setTimeout(function(){hidePeopleDD(\''+id+'\')},200)">'+
    '<div id="'+id+'-dd" class="people-dd" style="display:none"></div>'+
  '</div>';
}
function showPeopleDD(id, type){
  var inp = document.getElementById(id);
  var dd = document.getElementById(id+'-dd');
  if(!inp||!dd) return;
  var list = getPeople(type).filter(function(n){ return n.toLowerCase().includes(inp.value.toLowerCase()); });
  if(!list.length){ dd.style.display='none'; return; }
  dd.innerHTML = list.map(function(n){
    var init = n.split(' ').map(function(w){return w[0]||'';}).join('').toUpperCase().slice(0,2);
    return '<div class="people-dd-item" onmousedown="selectPerson(\''+id+'\',\''+n+'\')">'+
      '<div class="people-av">'+init+'</div>'+n+'</div>';
  }).join('');
  dd.style.display='block';
}
function filterPeopleDD(id,type){ showPeopleDD(id,type); }
function hidePeopleDD(id){ var dd=document.getElementById(id+'-dd'); if(dd) dd.style.display='none'; }
function selectPerson(id, name){
  var inp = document.getElementById(id);
  if(inp){ inp.value = name; hidePeopleDD(id); }
}

// ============================================================
// UTILITIES
// ============================================================
function fmtDate(d){ if(!d) return '-'; return d.split('-').reverse().join('.'); }
function nowDate(){ return new Date().toISOString().slice(0,10); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function uid(){ return Date.now() + Math.floor(Math.random()*1000); }

function getFilteredOrders(){
  var list = CURRENT_STORE==='all' ? DB.orders : DB.orders.filter(function(o){ return o.storeId===CURRENT_STORE; });
  return list.filter(function(o){ return periodMatchDate(o.date); });
}
function getFilteredIzdatnice(){
  var list = CURRENT_STORE==='all' ? DB.izdatnice : DB.izdatnice.filter(function(i){ return i.storeId===CURRENT_STORE; });
  return list.filter(function(i){ return periodMatchDate(i.date); });
}
function getFilteredFakture(){
  var list = CURRENT_STORE==='all' ? DB.fakture||[] : (DB.fakture||[]).filter(function(f){ return f.storeId===CURRENT_STORE; });
  return list.filter(function(f){ return periodMatchDate(f.date); });

// ============================================================
// PDF IMPORT NARUDŽBE (iz HACCP terenske aplikacije)
// ============================================================
function normalizeNameForMatch(s){
  return (s||'').toString().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/\s+/g,' ').trim();
}
function levenshtein(a,b){
  a = a||''; b = b||'';
  var m = a.length, n = b.length;
  if(m===0) return n;
  if(n===0) return m;
  var prev = new Array(n+1); var curr = new Array(n+1);
  for(var j=0;j<=n;j++) prev[j]=j;
  for(var i=1;i<=m;i++){
    curr[0]=i;
    for(var j2=1;j2<=n;j2++){
      var cost = a.charAt(i-1)===b.charAt(j2-1) ? 0 : 1;
      curr[j2] = Math.min(prev[j2]+1, curr[j2-1]+1, prev[j2-1]+cost);
    }
    var tmp = prev; prev = curr; curr = tmp;
  }
  return prev[n];
}
function matchProductByName(name){
  var n = normalizeNameForMatch(name);
  if(!n) return null;
  var exact = DB.products.find(function(p){ return normalizeNameForMatch(p.name)===n; });
  if(exact) return exact;
  var partial = DB.products.find(function(p){
    var pn = normalizeNameForMatch(p.name);
    return pn.indexOf(n)!==-1 || n.indexOf(pn)!==-1;
  });
  if(partial) return partial;
  // Zadnja razina: tolerancija na sitne OCR pogreške u čitanju naziva (npr. "Chocclate" umjesto "Chocolate")
  var best = null, bestDist = Infinity, bestLen = 1;
  DB.products.forEach(function(p){
    var pn = normalizeNameForMatch(p.name);
    var dist = levenshtein(n, pn);
    var len = Math.max(n.length, pn.length) || 1;
    if(dist < bestDist){ bestDist = dist; best = p; bestLen = len; }
  });
  if(best && (bestDist / bestLen) <= 0.25) return best;
  return null;
}
function matchProductInRowText(rowText){
  // Rezervna razina prepoznavanja: ako se artikl ne pronađe u stupcu "Okus/vrsta"
  // (npr. je zaglavlje tablice loše pročitano OCR-om pa su stupci pomaknuti —
  // čest slučaj kod kratkih narudžbi s malo teksta), potraži puni naziv artikla
  // BILO GDJE u cijelom retku, a ne samo u jednom (možda pogrešnom) stupcu.
  var n = normalizeNameForMatch(rowText);
  if(!n) return null;
  var hit = DB.products.find(function(p){
    var pn = normalizeNameForMatch(p.name);
    return pn && n.indexOf(pn)!==-1;
  });
  return hit || null;
}
function parsePdfNumber(s){
  if(!s) return 0;
  var m = String(s).replace(/\./g,'').replace(',', '.').match(/-?\d+(\.\d+)?/);
  return m ? parseFloat(m[0]) : 0;
}
function pdfClusterColBounds(items){
  var sorted = items.slice().sort(function(a,b){ return a.x-b.x; });
  var bounds = []; var lastEnd = null;
  sorted.forEach(function(it){
    var w = (typeof it.w==='number' && it.w>0) ? it.w : 0;
    if(lastEnd===null || (it.x-lastEnd)>25) bounds.push(it.x);
    lastEnd = it.x + w;
  });
  return bounds;
}
function pdfColIndexForX(x, bounds){
  var idx = 0;
  for(var i=0;i<bounds.length;i++){ if(x >= bounds[i]-5) idx = i; }
  return idx;
}
function pdfGroupRows(items){
  var rows = []; var tol = 10;
  items.forEach(function(it){
    var row = rows.find(function(r){ return Math.abs(r.y-it.y)<tol; });
    if(!row){ row = {y:it.y, items:[]}; rows.push(row); }
    row.items.push(it);
  });
  rows.forEach(function(r){ r.items.sort(function(a,b){ return a.x-b.x; }); });
  rows.sort(function(a,b){ return b.y-a.y; });
  return rows.map(function(r){
    return { y:r.y, items:r.items, text: r.items.map(function(i){ return i.str; }).join(' ').replace(/\s+/g,' ').trim() };
  }).filter(function(l){ return l.text; });
}
function pdfExtractOrderData(items){
  var lines = pdfGroupRows(items);
  var fullText = lines.map(function(l){ return l.text; }).join('\n');
  var storeMatch = fullText.match(/VS-\d+/);
  var storeId = storeMatch ? storeMatch[0] : null;
  var headerIdx = -1;
  for(var i=0;i<lines.length;i++){
    if(/artikl/i.test(lines[i].text) && /pakiranj/i.test(lines[i].text)){ headerIdx = i; break; }
  }
  var matched = [], unmatched = [];
  if(headerIdx===-1) return { storeId:storeId, matched:matched, unmatched:unmatched, fullText:fullText, error:'Tablica artikala nije pronađena u PDF-u' };
  var headerItems = lines[headerIdx].items;
  var bounds = pdfClusterColBounds(headerItems);
  var headerBuckets = {};
  headerItems.forEach(function(it){
    var ci = pdfColIndexForX(it.x, bounds);
    headerBuckets[ci] = (headerBuckets[ci]?headerBuckets[ci]+' ':'') + it.str;
  });
  // Uloga svakog stupca se odredjuje po TEKSTU u zaglavlju, ne po fiksnom
  // indeksu — razliciti izvozi iz terenske aplikacije (sa ili bez stupca
  // Sifra) imaju razlicit raspored stupaca.
  var roleCol = { name:-1, pakiranje:-1, komada:-1 };
  for(var c=0;c<bounds.length;c++){
    var t = (headerBuckets[c]||'').toLowerCase();
    if(/pakiranj/.test(t)) roleCol.pakiranje = c;
    if(/komad/.test(t)) roleCol.komada = c;
  }
  for(var c2=0;c2<bounds.length;c2++){
    var t2 = (headerBuckets[c2]||'').toLowerCase();
    if(/okus/.test(t2) || /vrsta/.test(t2)){ roleCol.name = c2; break; }
  }
  if(roleCol.name===-1){
    for(var c3=0;c3<bounds.length;c3++){
      var t3 = (headerBuckets[c3]||'').toLowerCase();
      if(/artikl/.test(t3)){ roleCol.name = c3; break; }
    }
  }
  if(roleCol.name===-1) roleCol.name = 0;
  var totalsKomada = null;
  for(var i2=headerIdx+1; i2<lines.length; i2++){
    var ln = lines[i2];
    if(/^ukupno\b/i.test(ln.text)){
      // Zapamti ukupnu količinu (stupac Komada) s retka UKUPNO — koristi se niže
      // kao sigurnosna mreža ako je OCR izgubio količinu na retku jedine stavke.
      var totalsBuckets = {};
      ln.items.forEach(function(it){
        var ci = pdfColIndexForX(it.x, bounds);
        totalsBuckets[ci] = (totalsBuckets[ci]?totalsBuckets[ci]+' ':'') + it.str;
      });
      if(roleCol.komada!==-1){
        var tk = parseInt(parsePdfNumber((totalsBuckets[roleCol.komada]||'').trim()));
        if(tk>0) totalsKomada = tk;
      }
      break;
    }
    if(!ln.items.length) continue;
    var buckets = {};
    ln.items.forEach(function(it){
      var ci = pdfColIndexForX(it.x, bounds);
      buckets[ci] = (buckets[ci]?buckets[ci]+' ':'') + it.str;
    });
    var flavorText = (buckets[roleCol.name]||'').trim();
    var pakiranjeText = roleCol.pakiranje!==-1 ? (buckets[roleCol.pakiranje]||'').trim() : '';
    var komadaText = roleCol.komada!==-1 ? (buckets[roleCol.komada]||'').trim() : '';
    var prod = flavorText ? matchProductByName(flavorText) : null;
    if(!prod){
      // Stupac "Okus/vrsta" je prazan ili artikl u njemu nije prepoznat — pokušaj
      // pronaći artikl u cijelom tekstu retka prije nego što ga odbaciš.
      prod = matchProductInRowText(ln.text);
    }
    if(!flavorText && !prod) continue;
    var kgKom = parsePdfNumber(pakiranjeText) || 0;
    var kom = parseInt(parsePdfNumber(komadaText)) || 0;
    var entry = { rawName: flavorText || (prod?prod.name:ln.text), kgKom:kgKom, kom:kom, _komMissing:!kom };
    if(prod){ entry.prod = prod; matched.push(entry); } else { unmatched.push(entry); }
  }
  // Ako je prepoznata TOČNO jedna stavka i njoj nije očitana količina (čest OCR
  // propust kod kratkih narudžbi s malo teksta), a red UKUPNO ima ukupnu količinu —
  // ta ukupna količina onda pripada upravo toj jedinoj stavci.
  var allEntries = matched.concat(unmatched);
  if(allEntries.length===1 && allEntries[0]._komMissing && totalsKomada){
    allEntries[0].kom = totalsKomada;
  }
  allEntries.forEach(function(e){ if(!e.kom) e.kom = 1; delete e._komMissing; });
  return { storeId:storeId, matched:matched, unmatched:unmatched, fullText:fullText };
}
function removeGridLinesFromCanvas(ctx, w, h){
  // Uklanja duge ravne linije tablice (koje zbunjuju OCR) tako da ih oboji u bijelo,
  // a tekst (puno kraći nizovi tamnih piksela) ostavlja netaknutim.
  var imgData = ctx.getImageData(0,0,w,h);
  var data = imgData.data;
  var n = w*h;
  var isDark = new Uint8Array(n);
  for(var i=0;i<n;i++){
    var r=data[i*4], g=data[i*4+1], b=data[i*4+2];
    var gray = r*0.299+g*0.587+b*0.114;
    isDark[i] = gray < 200 ? 1 : 0;
  }
  function paintWhite(px,py){
    var idx=(py*w+px)*4;
    data[idx]=255; data[idx+1]=255; data[idx+2]=255;
  }
  var minRunH = Math.max(60, Math.floor(w*0.30));
  for(var y=0;y<h;y++){
    var runStart = -1;
    for(var x=0;x<=w;x++){
      var dark = x<w && isDark[y*w+x];
      if(dark){ if(runStart===-1) runStart=x; }
      else if(runStart!==-1){
        if((x-runStart)>=minRunH){ for(var xx=runStart; xx<x; xx++) paintWhite(xx,y); }
        runStart=-1;
      }
    }
  }
  var minRunV = Math.max(60, Math.floor(h*0.08));
  for(var x2=0;x2<w;x2++){
    var runStart2 = -1;
    for(var y2=0;y2<=h;y2++){
      var dark2 = y2<h && isDark[y2*w+x2];
      if(dark2){ if(runStart2===-1) runStart2=y2; }
      else if(runStart2!==-1){
        if((y2-runStart2)>=minRunV){ for(var yy=runStart2; yy<y2; yy++) paintWhite(x2,yy); }
        runStart2=-1;
      }
    }
  }
  ctx.putImageData(imgData,0,0);
}
function ocrWordsToItems(words){
  return (words||[]).filter(function(w){ return w.text && w.text.trim(); }).map(function(w){
    var bb = w.bbox;
    return { str:w.text, x:bb.x0, y:-bb.y0, w:(bb.x1-bb.x0) };
  });
}
function mergeOcrItemsSnapped(primary, secondary){
  // Spaja riječi iz drugog OCR prolaza u VEĆ POSTOJEĆE retke prvog prolaza —
  // nikad ne stvara nove retke. Time se izbjegava pomak/rasipanje redaka do
  // kojeg bi došlo kad bi se dva neovisna prolaza grupirala zajedno (svaki
  // prolaz čita malo drugačije y-koordinate za isti tekst).
  var rows = pdfGroupRows(primary);
  if(!rows.length) return primary;
  var merged = primary.slice();
  secondary.forEach(function(it){
    var best = null, bestDist = Infinity;
    rows.forEach(function(r){
      var d = Math.abs(r.y - it.y);
      if(d < bestDist){ bestDist = d; best = r; }
    });
    if(!best || bestDist > 30) return;
    var dup = merged.some(function(m){ return m.str===it.str && Math.abs(m.x-it.x)<10 && Math.abs(m.y-best.y)<10; });
    if(dup) return;
    merged.push({ str:it.str, x:it.x, y:best.y, w:it.w });
  });
  return merged;
}
async function ocrExtractOrderData(pdf){
  if(!window.Tesseract) throw new Error('OCR modul nije učitan (provjerite internetsku vezu) — potreban je za čitanje skenirane/slikovne narudžbenice');
  var page = await pdf.getPage(1);
  var scale = 2.5;
  var viewport = page.getViewport({scale:scale});
  var canvas = document.createElement('canvas');
  canvas.width = Math.ceil(viewport.width);
  canvas.height = Math.ceil(viewport.height);
  var ctx = canvas.getContext('2d');
  await page.render({canvasContext:ctx, viewport:viewport}).promise;
  removeGridLinesFromCanvas(ctx, canvas.width, canvas.height);
  var worker = await Tesseract.createWorker('hrv+eng');
  try{
    var result = await worker.recognize(canvas);
    var items = ocrWordsToItems(result.data.words);
    var parsed = pdfExtractOrderData(items);
    var totalFound = parsed.matched.length + parsed.unmatched.length;
    if(totalFound < 3){
      // Kratke narudžbe (malo stavki, puno praznog prostora oko teksta) katkad
      // zbune Tesseractov zadani raspored stranice, koji onda izgubi cijele
      // stupce (npr. Komada/Ukupno) ili čak cijele retke. Dodatni prolaz s
      // rasporedom za "raspršeni tekst" to ponekad uhvati — spaja se BEZ
      // pomicanja već prepoznatih redaka (vidi mergeOcrItemsSnapped).
      try{
        var sparsePsm = (window.Tesseract && Tesseract.PSM && Tesseract.PSM.SPARSE_TEXT) || '11';
        await worker.setParameters({ tessedit_pageseg_mode: sparsePsm });
        var result2 = await worker.recognize(canvas);
        var items2 = ocrWordsToItems(result2.data.words);
        var mergedItems = mergeOcrItemsSnapped(items, items2);
        var parsed2 = pdfExtractOrderData(mergedItems);
        if((parsed2.matched.length + parsed2.unmatched.length) >= totalFound){
          parsed = parsed2;
        }
      }catch(e){ /* dodatni prolaz je samo sigurnosna mreža — ako ne uspije, ostaje prvi rezultat */ }
    }
    return parsed;
  } finally {
    try{ await worker.terminate(); }catch(e){}
  }
}
async function parsePdfOrderFile(file){
  if(!window.pdfjsLib) throw new Error('PDF čitač nije učitan (provjerite internetsku vezu)');
  var buf = await file.arrayBuffer();
  var pdf = await pdfjsLib.getDocument({data:buf}).promise;
  var allItems = [];
  for(var p=1; p<=pdf.numPages; p++){
    var page = await pdf.getPage(p);
    var content = await page.getTextContent();
    content.items.forEach(function(it){
      if(it.str && it.str.trim()) allItems.push({ str:it.str, x:it.transform[4], y:it.transform[5], w:Math.abs(it.width||0) });
    });
  }
  if(allItems.length < 20){
    // PDF nema (dovoljno) teksta u sebi — vjerojatno je skenirana slika iz terenske aplikacije. Pokušaj OCR-om.
    return ocrExtractOrderData(pdf);
  }
  return pdfExtractOrderData(allItems);
}
function handlePdfOrderUpload(ev){
  var file = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if(!file) return;
  toast('Učitavam PDF... (ako je skenirana slika, prepoznavanje teksta može potrajati malo dulje)', 'ok');
  parsePdfOrderFile(file).then(function(parsed){
    if(parsed.error){ toast(parsed.error, 'err'); return; }
    if(!parsed.matched.length && !parsed.unmatched.length){ toast('Nema prepoznatih stavki u PDF-u', 'err'); return; }
    prefillOrderFromPdf(parsed);
  }).catch(function(e){
    console.error(e);
    toast('Greška pri čitanju PDF-a: '+(e.message||e), 'err');
  });
}
function prefillOrderFromPdf(parsed){
  openOrderModal(null);
  if(parsed.storeId){
    var sel = document.getElementById('o-store');
    if(sel){
      var has = false;
      for(var i=0;i<sel.options.length;i++){ if(sel.options[i].value===parsed.storeId){ has=true; break; } }
      if(has){ sel.value = parsed.storeId; onOrderStoreChange(parsed.storeId); }
    }
  }
  oiRows = parsed.matched.map(function(m){
    var kom = m.kom||1, kgKom = m.kgKom||0;
    return { prodId:m.prod.id, code:m.prod.code, name:m.prod.name, unit:m.prod.unit||'kg', kom:kom, kgKom:kgKom, qty:kom*kgKom };
  });
  renderOIRows();
  if(parsed.unmatched.length){
    toast('Iz PDF-a uneseno '+parsed.matched.length+' stavki. Nepronađeno u katalogu: '+parsed.unmatched.map(function(u){ return u.rawName; }).join(', '), 'err');
  } else if(parsed.matched.length){
    toast('Iz PDF-a uneseno '+parsed.matched.length+' stavki — provjerite i spremite narudžbu', 'ok');
  }
}

function oiProdChange(i){
  var sel = document.getElementById('oi-prod-'+i);
  var pid = parseInt(sel.value);
  var prod = DB.products.find(function(p){ return p.id===pid; });
  if(!prod) return;
  oiRows[i].prodId = pid;
  oiRows[i].code = prod.code;
  oiRows[i].name = prod.name;
  oiRows[i].unit = prod.unit||'kg';
  document.getElementById('oi-code-'+i).value = prod.code;
  document.getElementById('oi-unit-'+i).value = prod.unit||'kg';
  calcKg(i);
}
function syncKgFromSel(i){
  var sel = document.getElementById('oi-kgsel-'+i);
  if(sel.value){
    var v = parseFloat(sel.value);
    document.getElementById('oi-kgin-'+i).value = v;
    oiRows[i].kgKom = v;
    calcKg(i);
  }
}
function syncKgFromIn(i){
  var inp = document.getElementById('oi-kgin-'+i);
  var v = parseFloat(inp.value)||0;
  oiRows[i].kgKom = v;
  // find closest preset
  var sel = document.getElementById('oi-kgsel-'+i);
  var found = false;
  for(var j=0;j<sel.options.length;j++){
    if(Math.abs(parseFloat(sel.options[j].value)-v)<0.001){ sel.selectedIndex=j; found=true; break; }
  }
  if(!found) sel.selectedIndex=0;
  calcKg(i);
}
function calcKg(i){
  var kom = parseInt(document.getElementById('oi-kom-'+i).value)||1;
  var kg = oiRows[i].kgKom||0;
  var total = kom*kg;
  oiRows[i].kom = kom;
  oiRows[i].qty = total;
  document.getElementById('oi-qty-'+i).value = total.toFixed(3);
}

function onOrderStoreChange(storeId){

function saveOrder(id){
  var storeId = document.getElementById('o-store').value;
  var date = document.getElementById('o-date').value;
  var delivery = document.getElementById('o-delivery').value;
  var addr = document.getElementById('o-addr').value;
  var note = document.getElementById('o-note').value;
  var status = document.getElementById('o-status').value;
  var ponuda = document.getElementById('o-ponuda').value;
  var racun = document.getElementById('o-racun').value;

  // collect items
  var items = oiRows.map(function(row,i){
    var prod = DB.products.find(function(p){ return p.id===row.prodId; });
    if(!prod) return null;
    return { prodId:row.prodId, code:row.code, name:row.name, unit:row.unit, kom:row.kom, kgKom:row.kgKom, qty:row.qty };
  }).filter(Boolean);

  if(id){
    var o = DB.orders.find(function(x){ return x.id===id; });
    if(o){ Object.assign(o,{storeId,date,delivery,deliveryAddr:addr,note,status,ponuda,racun,items}); }
  } else {
    DB.orders.push({ id:uid(), number:nextOrderNum(), storeId, date, delivery, deliveryAddr:addr, note, status, ponuda, racun, items });
  }
  saveDB(); closeModal(); renderOrders(); updateBadges();
}

function renderIzdatniceTable(izdatnice){

  if(!izdatnice.length){ tb.innerHTML='<tr><td colspan="10" style="padding:40px;text-align:center;color:var(--text3)">Nema izdatnica</td></tr>'; return; }
  tb.innerHTML = izdatnice.slice().reverse().map(function(iz,i){
    var kg = 0; iz.items.forEach(function(it){ kg+=Number(it.qty)||0; });
    return '<tr>'+
      '<td class="tbl-num">'+(izdatnice.length-i)+'</td>'+
      '<td class="tbl-id">'+esc(iz.number)+'</td>'+
      '<td>'+fmtDate(iz.date)+'</td>'+

      '<td>'+badgeHtml(iz.status)+'</td>'+
      '<td style="font-size:12px">'+(iz.receiver||'—')+'</td>'+
      '<td style="font-size:12px">'+(iz.sender||'—')+'</td>'+
      '<td>'+kg.toFixed(3)+' kg</td>'+
      '<td style="white-space:nowrap">'+

function filterIzdatnice(){
  var q = (document.getElementById('izd-search')||{}).value||'';
  var list = getFilteredIzdatnice().filter(function(i){ return !q || i.number.toLowerCase().includes(q.toLowerCase()) || (i.orderRef||'').toLowerCase().includes(q.toLowerCase()); });
  renderIzdatniceTable(list);
}

function loadOrderItems(){
  var sel = document.getElementById('iz-order-ref');
  if(!sel||!sel.value) return;
  var o = DB.orders.find(function(x){ return x.id===parseInt(sel.value); });
  if(!o) return;
  izRows = o.items.map(function(it){ return {prodId:it.prodId,code:it.code,name:it.name,unit:it.unit,orderedQty:it.qty,qty:it.qty}; });

  var tb = document.getElementById('iz-tbody');
  if(!tb) return;

function izProdChange(i){
  var pid = parseInt(document.getElementById('iz-prod-'+i).value);
  var p = DB.products.find(function(x){ return x.id===pid; });
  if(!p) return;
  izRows[i].prodId=pid; izRows[i].code=p.code; izRows[i].name=p.name; izRows[i].unit=p.unit||'kg';
}

function saveIzd(id){
  var storeId = document.getElementById('iz-store').value;
  var date = document.getElementById('iz-date').value;
  var status = document.getElementById('iz-status').value;
  var orderRefSel = document.getElementById('iz-order-ref');
  var orderRefId = orderRefSel.value ? parseInt(orderRefSel.value) : null;
  var orderRef = orderRefId ? (DB.orders.find(function(o){return o.id===orderRefId;})||{}).number||'' : '';
  var receiver = document.getElementById('iz-rcv').value;
  var sender = document.getElementById('iz-snd').value;
  var vehicle = document.getElementById('iz-vehicle').value;
  var note = document.getElementById('iz-note').value;
  savePerson('rcv',receiver); savePerson('snd',sender);

  var items = izRows.map(function(row,i){
    var q = parseFloat(document.getElementById('iz-qty-'+i).value)||row.qty||0;
    return {prodId:row.prodId,code:row.code,name:row.name,unit:row.unit,orderedQty:row.orderedQty,qty:q};
  }).filter(function(r){ return r.prodId; });

  if(id){
    var iz = DB.izdatnice.find(function(x){ return x.id===id; });
    if(iz) Object.assign(iz,{storeId,date,status,orderRefId,orderRef,receiver,sender,vehicle,note,items});
  } else {
    DB.izdatnice.push({id:uid(),number:nextIzdNum(),storeId,date,status,orderRefId,orderRef,receiver,sender,vehicle,note,items});
  }
  saveDB(); closeModal(); renderIzdatnice(); updateBadges();
}

function exportIzdatniceExcel(){
  if(typeof XLSX==='undefined') return;
  var iz = getFilteredIzdatnice();
  var ws_data = [['Broj','Datum','Lokacija','Vezana narudžba','Status','Primio','Izdao','Šifra','Naziv','Naručeno kg','Izdano kg','Jed.']];
  iz.forEach(function(i){ i.items.forEach(function(it){
    ws_data.push([i.number,i.date,getStoreName(i.storeId),i.orderRef||'',i.status,i.receiver||'',i.sender||'',it.code,it.name,it.orderedQty,it.qty,it.unit]);
  }); });
  var wb = XLSX.utils.book_new(); var ws = XLSX.utils.aoa_to_sheet(ws_data);
  XLSX.utils.book_append_sheet(wb,'Izdatnice',ws);
  XLSX.writeFile(wb,'PN_Izdatnice_'+getPeriodFilename()+'.xlsx');
}

var pendingFakture = [];
function fakturaFilesSelected(inp){
  pendingFakture = [];
  var prev = document.getElementById('fakt-preview');
  if(!inp.files.length){ if(prev) prev.innerHTML=''; return; }
  var files = Array.from(inp.files);
  var loaded = 0;
  var items = [];
  files.forEach(function(file,i){
    var reader = new FileReader();
    reader.onload = function(e){
      pendingFakture.push({name:file.name, dataUrl:e.target.result, size:file.size});
      loaded++;
      if(loaded===files.length){
        if(prev) prev.innerHTML = pendingFakture.map(function(f){
          return '<div class="invoice-item"><div class="invoice-icon" style="color:var(--green)"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="20,6 9,17 4,12"/></svg></div><div class="invoice-name">'+esc(f.name)+'</div></div>';
        }).join('');
      }
    };
    reader.readAsDataURL(file);
  });
}

function saveFakture(){
  var storeId = document.getElementById('fakt-store').value;
  if(!storeId){ toast('Odaberite lokaciju','err'); return; }
  if(!pendingFakture.length){ toast('Odaberite datoteke','err'); return; }
  if(!DB.fakture) DB.fakture = [];
  pendingFakture.forEach(function(f){
    DB.fakture.push({id:uid(), storeId:storeId, name:f.name, date:nowDate(), dataUrl:f.dataUrl});
  });
  pendingFakture = [];
  saveDB(); closeModal(); renderFakture();
}

function deleteFaktura(id){
  confirmToast('Obrisati fakturu?', function(){
  DB.fakture = (DB.fakture||[]).filter(function(f){ return f.id!=id; });
  saveDB(); renderFaktureList();
  });
}

function saveArticle(id){
  var code = document.getElementById('ar-code').value.trim();
  var name = document.getElementById('ar-name').value.trim();

  var obj = {code,name,supplier:document.getElementById('ar-sup').value,cat:document.getElementById('ar-cat').value,unit:document.getElementById('ar-unit').value||'kg',desc:document.getElementById('ar-desc').value};
  if(id){ var p=DB.products.find(function(x){return x.id===id;}); if(p) Object.assign(p,obj); }

  saveDB(); closeModal(); renderArticles();
}

function createStroj(){
  var newId = document.getElementById('sv-id').value.trim().toUpperCase();

  if(!newId||!newName){ toast('ID i naziv su obavezni!','err'); return; }
  if(DB.strojevi.find(function(s){return s.id===newId;})){ toast('Stroj s tim ID-om već postoji!','err'); return; }

function handleLogoUpload(inp){
  if(!inp.files[0]) return;
  var reader = new FileReader();
  reader.onload = function(e){ DB.settings.logoDataUrl = e.target.result; saveDB(); refreshLogo(); renderSettings(); };
  reader.readAsDataURL(inp.files[0]);
}
function removeLogo(){ DB.settings.logoDataUrl = null; saveDB(); refreshLogo(); renderSettings(); }

function exportBackup(){
  var json = JSON.stringify(DB, null, 2);
  var a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,'+encodeURIComponent(json);
  a.download = 'perla_notte_backup_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
}

function importBackup(inp){
  if(!inp.files[0]) return;
  var reader = new FileReader();
  reader.onload = function(e){
    try{
      var d = JSON.parse(e.target.result);
      var parsed = d;
      confirmToast('Uvoz će zamijeniti sve podatke. Nastaviti?', function(){
        DB = Object.assign(freshDB(), parsed);
        DB.orders.forEach(function(o){ if(!o.storeId) o.storeId='VS-001'; });
        DB.izdatnice.forEach(function(i){ if(!i.storeId) i.storeId='VS-001'; });
        saveDB(); populateStoreSelect(); refreshLogo(); showPage('dashboard');
        toast('Uvoz uspješan!','ok');
      });
    }catch(ex){ toast('Greška pri uvozu: '+ex.message,'err'); }
  };
  reader.readAsText(inp.files[0]);
}

function openModal(eyebrow, title, bodyHTML, opt){
  opt = opt || {};
  closeModal();
  var ov = document.createElement('div');
  ov.className = 'overlay'; ov.id = 'm-ov';
  var heroClass = opt.heroClass || 'done';
  var heroIcon = opt.heroIcon || '';
  var heroSub = opt.heroSub || '';
  var heroVal = opt.heroVal || '';
  var heroBadge = opt.heroBadge || '';
  var showHero = !!(heroVal || heroSub);
  var heroHTML = showHero ? (
    '<div class="hero '+heroClass+'">'+
    '<div class="avatar">'+heroIcon+'</div>'+
    '<div><div class="hn">'+heroSub+'</div><div class="hv">'+heroVal+'</div></div>'+
    (heroBadge?'<div class="hb">'+heroBadge+'</div>':'')+
    '</div>'
  ) : '';
  var delBtn = opt.del ? '<button class="btn dan left" onclick="'+opt.del+'">Obriši</button>' : '';
  var saveLabel = opt.saveLabel || 'Spremi';
  var saveFn = opt.saveFn || '';
  var extraBtns = opt.extraBtns || '';
  ov.innerHTML = '<div class="modal '+(opt.wide?'wide ':'')+'">' +
    '<div class="m-head">'+
      '<div><div class="eyebrow">'+eyebrow+'</div><h2>'+title+'</h2></div>'+
      '<button class="x" onclick="closeModal()">&#x2715;</button>'+
    '</div>'+
    heroHTML+
    '<div class="m-body" id="m-body">'+bodyHTML+'</div>'+
    '<div class="m-foot">'+
      delBtn+
      extraBtns+
      '<button class="btn" onclick="closeModal()">Odustani</button>'+
      (saveFn?'<button class="btn pri" onclick="'+saveFn+'">'+saveLabel+'</button>':'')+
    '</div>'+
  '</div>';
  document.body.appendChild(ov);
  // close on overlay click
  ov.addEventListener('mousedown', function(e){ ov._down = e.target===ov; });
  ov.addEventListener('mouseup', function(e){ if(ov._down && e.target===ov) closeModal(); });
  document.body.style.overflow = 'hidden';
}
// Legacy showModal wrapper — all old calls go through here
function showModal(title, body, footer, cls){
  closeModal();
  var ov = document.createElement('div');
  ov.className = 'overlay'; ov.id = 'm-ov';
  ov.innerHTML = '<div class="modal '+(cls||'')+'">' +
    '<div class="m-head">'+
      '<div><div class="eyebrow">Perla Notte · Narudžbenica</div><h2>'+title+'</h2></div>'+
      '<button class="x" onclick="closeModal()">&#x2715;</button>'+
    '</div>'+
    '<div class="m-body" id="m-body">'+body+'</div>'+
    (footer?'<div class="m-foot">'+footer+'</div>':'')+
  '</div>';
  document.body.appendChild(ov);
  ov.addEventListener('mousedown', function(e){ ov._down = e.target===ov; });
  ov.addEventListener('mouseup', function(e){ if(ov._down && e.target===ov) closeModal(); });
  document.body.style.overflow = 'hidden';
}
function closeModal(){
  var o = document.getElementById('m-ov');
  if(o){ o.remove(); }
  // legacy fallback
  var bg = document.getElementById('modal-bg');
  if(bg) bg.style.display = 'none';
  document.body.style.overflow = '';
}

function seedDemoOrders(){
  if(DB.orders.length || DB.izdatnice.length) return;
  var prods = DB.products;
  function mkItem(p, qty){ return {prodId:p.id, code:p.code, name:p.name, unit:p.unit, kom:1, kgKom:qty, qty:qty}; }
  var statuses = ['confirmed','confirmed','sent','partial','cancelled','confirmed','draft','confirmed','confirmed','sent'];
  var dates = ['2026-01-12','2026-02-08','2026-02-25','2026-03-15','2026-04-02','2026-05-20','2026-06-10','2026-07-05','2026-08-18','2026-09-10'];
  for(var i=0;i<10;i++){
    var items = [];
    var n = 2+(i%3);
    for(var j=0;j<n;j++){
      var p = prods[(i+j)%prods.length];
      var qty = Math.round((5 + Math.random()*20)*10)/10;
      items.push(mkItem(p, qty));
    }
    DB.orders.push({
      id: uid(), number: nextOrderNum(), storeId:'VS-001', date: dates[i],
      delivery: dates[i], deliveryAddr:'Put brodarice 6, 21000 Split',
      note:'', status: statuses[i], ponuda:'', racun:'', items: items
    });
  }
  DB.orders.forEach(function(o){
    var items = o.items.map(function(it){
      var issued = Math.round(it.qty * (0.75+Math.random()*0.25) * 10)/10;
      return {prodId:it.prodId, code:it.code, name:it.name, unit:it.unit, orderedQty:it.qty, qty:issued};
    });
    DB.izdatnice.push({
      id: uid(), number: nextIzdNum(), storeId:'VS-001', date:o.date, status:'confirmed',
      orderRefId:o.id, orderRef:o.number, receiver:'Ivan Ivić', sender:'Polleo Adria',
      vehicle:'ST-123-AB', note:'', items: items
    });
  });
  saveDBLocalOnly();
}

  if(DB.settings._demoIzdSeeded) return;
  var existingRefs = {};
  DB.izdatnice.forEach(function(iz){ if(iz.orderRefId) existingRefs[iz.orderRefId]=true; });
  DB.orders.forEach(function(o){
    if(existingRefs[o.id]) return;
    var items = (o.items||[]).map(function(it){

// ============================================================
// PRODUCT COLOR LOOKUP
// ============================================================
var FALLBACK_COLORS = ['#6ec6f5','#ef5da8','#f97316','#a78bfa','#22d3ee','#e879f9','#facc15','#34d399','#f87171','#60a5fa'];

function getProductColor(name, idx){
  if(!name) return FALLBACK_COLORS[idx % FALLBACK_COLORS.length];
  var p = DB.products.find(function(p){ return p.name === name || p.name.toLowerCase() === (name||'').toLowerCase(); });
  if(p && p.color) return p.color;
  // hash fallback
  var h = 0; for(var i=0;i<name.length;i++) h=(h*31+name.charCodeAt(i))&0xffff;
  return FALLBACK_COLORS[h % FALLBACK_COLORS.length];
}

function getProductColorAlpha(name, idx, alpha){
  var hex = getProductColor(name, idx);
  // convert hex to rgba
  var r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return 'rgba('+r+','+g+','+b+','+(alpha||.75)+')';
}

function toast(msg, type){
  var wrap = document.getElementById('toast-wrap');
  if(!wrap) return;
  var t = document.createElement('div');
  t.className = 'toast' + (type==='err'?' err':type==='ok'?' ok':'');
  var icon = type==='ok'?'✓':type==='err'?'✕':'ℹ';
  t.innerHTML = '<span>'+icon+'</span> '+msg;
  wrap.appendChild(t);
  setTimeout(function(){ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(function(){ t.remove(); },300); }, 2800);
}
var _confirmCbs = [];
function _runConfirmCb(idx){
  var cb = _confirmCbs[idx];
  _confirmCbs[idx] = null;
  if(typeof cb === 'function') cb();
}
function confirmToast(msg, cb){
  var wrap = document.getElementById('toast-wrap');
  var t = document.createElement('div');
  t.className = 'toast';
  t.style.pointerEvents='all';
  t.style.gap='10px';
  var cbIdx = _confirmCbs.push(cb) - 1;
  t.innerHTML = '<span>'+msg+'</span> <button onclick="this.closest(\'.toast\').remove();_runConfirmCb('+cbIdx+')" style="background:var(--red);color:#fff;border:0;border-radius:8px;padding:4px 10px;font-weight:600;cursor:pointer;font-size:13px">Obriši</button><button onclick="this.closest(\'.toast\').remove()" style="background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:8px;padding:4px 10px;cursor:pointer;font-size:13px">Odustani</button>';
  wrap.appendChild(t);
  setTimeout(function(){ if(t.parentNode){t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(function(){ t.remove(); },300);} }, 5000);
}

window.onload = function(){
  var theme = localStorage.getItem('pn_theme')||'light';
  document.documentElement.setAttribute('data-theme', theme);
  updateThemeBtn();
  authInit();
  if('serviceWorker' in navigator){
    // SW namjerno NIŠTA ne sprema u cache (čisti "network passthrough") — jedina
    // mu je svrha da Android/Chrome ponudi pravu instalaciju aplikacije (Add to
    // Home Screen kao app, a ne obična prečica). Nema keširanja pa nema ni
    // rizika od zastarjelog sadržaja koji je uzrokovao ranije probleme.
    navigator.serviceWorker.register('./sw.js').catch(function(e){ console.warn('SW registracija nije uspjela:', e); });
  }
};

function startApp(){
  loadDB();
  migrateOldData();
  seedProducts();
  seedDemoOrders();
  patchDemoIzdatnice();
  patchVS001Details();
  patchDefaultLogo();
  patchLogoV2();
  patchLogoV3();
  syncFromSupabase().then(function(){
    _initialSyncDone = true;
    // ensure storeId on all records
    DB.orders.forEach(function(o){ if(!o.storeId) o.storeId='VS-001'; });
    DB.izdatnice.forEach(function(i){ if(!i.storeId) i.storeId='VS-001'; });
    if(!DB.strojevi||!DB.strojevi.length) DB.strojevi = JSON.parse(JSON.stringify(DEFAULT_STORES));
    // Remove auto-generated placeholder stores (VS-002 to VS-015 with no addr that weren't user-added)
    var AUTO_PLACEHOLDERS = ['FIT STUDIO SPLIT','POWER GYM','ENERGY FIT','SPORT CLUB','OLIMP GYM','TITAN FITNESS','PRIME SPORT','FLEX GYM','IRON HOUSE','APEX FITNESS','CROSSFIT CENTER','BODY LAB','WELLNESS CLUB','ARENA SPORT'];
    DB.strojevi = DB.strojevi.filter(function(s){ return s.id==='VS-001' || !AUTO_PLACEHOLDERS.includes(s.name) || s.addr; });
    if(!DB.fakture) DB.fakture = [];
    var _codesFixed = syncItemCodesWithCatalog();
    if(_codesFixed){ saveDB(); } else { saveDBLocalOnly(); }
    populateStoreSelect();
    refreshLogo();
    renderPeriodBar();
    showPage('dashboard');
  });
}

function authInit(){
  if(!sbClient){ var g=document.getElementById('auth-gate'); if(g) g.style.display='none'; startApp(); return; }
  sbClient.auth.getSession().then(function(res){
    var session = res && res.data ? res.data.session : null;
    if(session){
      var g=document.getElementById('auth-gate'); if(g) g.style.display='none';
      startApp();
    }
  }).catch(function(){});
}

function authSignIn(){
  if(!sbClient) return;
  var email = (document.getElementById('auth-email').value||'').trim();
  var pass = document.getElementById('auth-pass').value||'';
  var msg = document.getElementById('auth-msg');
  if(!email||!pass){ msg.textContent='Upiši e-mail i lozinku.'; msg.style.color='var(--red)'; return; }
  msg.textContent='Prijava...'; msg.style.color='var(--muted)';
  sbClient.auth.signInWithPassword({email:email, password:pass}).then(function(res){
    if(res.error){ msg.textContent='Pogrešan e-mail ili lozinka.'; msg.style.color='var(--red)'; return; }
    document.getElementById('auth-gate').style.display='none';
    startApp();
  }).catch(function(e){ msg.textContent='Greška: '+(e&&e.message?e.message:e); msg.style.color='var(--red)'; });
}

function authSignUp(){
  if(!sbClient) return;
  var email = (document.getElementById('auth-email').value||'').trim();
  var pass = document.getElementById('auth-pass').value||'';
  var msg = document.getElementById('auth-msg');
  if(!email||!pass){ msg.textContent='Upiši e-mail i lozinku (min. 6 znakova).'; msg.style.color='var(--red)'; return; }
  if(pass.length<6){ msg.textContent='Lozinka mora imati barem 6 znakova.'; msg.style.color='var(--red)'; return; }
  msg.textContent='Postavljanje...'; msg.style.color='var(--muted)';
  sbClient.auth.signUp({email:email, password:pass}).then(function(res){
    if(res.error){ msg.textContent = res.error.message||'Greška pri registraciji.'; msg.style.color='var(--red)'; return; }
    if(res.data && res.data.session){
      document.getElementById('auth-gate').style.display='none';
      startApp();
    } else {
      msg.textContent='Poslali smo ti e-mail za potvrdu na '+email+' — otvori ga, potvrdi, pa se ovdje prijavi lozinkom koju si upravo postavio.';
      msg.style.color='var(--green)';
    }
  }).catch(function(e){ msg.textContent='Greška: '+(e&&e.message?e.message:e); msg.style.color='var(--red)'; });
}

function authSignOut(){
  if(!sbClient){ location.reload(); return; }
  sbClient.auth.signOut().then(function(){ location.reload(); }).catch(function(){ location.reload(); });
}
